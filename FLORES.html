    <title>FLORES</title>

    <style>
  .mensaje-top {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 20px 0;
    pointer-events: none;
  }
  .frase-principal {
    font-family: 'Georgia', serif;
    font-size: clamp(1rem, 2.2vw, 1.45rem);
    color: #fff;
    text-align: center;
    text-shadow: 0 0 14px #ff69b4, 0 0 30px #ff1493;
    letter-spacing: 0.03em;
    line-height: 1.5;
    animation: fadeInDown 2s ease forwards;
    max-width: 700px;
  }
  .frase-amor {
    margin-top: 10px;
    font-family: 'Georgia', serif;
    font-size: clamp(1.2rem, 3vw, 2rem);
    font-style: italic;
    font-weight: bold;
    color: #ff69b4;
    text-shadow: 0 0 16px #ff1493, 0 0 40px #ff69b4;
    letter-spacing: 0.06em;
    animation: fadeInDown 2.5s ease forwards, glowPulse 2.5s ease-in-out infinite;
  }
  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-30px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes glowPulse {
    0%, 100% { text-shadow: 0 0 16px #ff1493, 0 0 40px #ff69b4; }
    50%       { text-shadow: 0 0 35px #ff1493, 0 0 80px #ff69b4; }
  }
</style>

</head>
